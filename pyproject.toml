[tool.poetry]
name = "sysmlpy-api-services"
version = "0.1.0"
description = "Python implementation of SysMLv2 REST API Services using Flask-RESTX and sysmlpy"
authors = ["Jon Fox <jon.fox@drfox.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
flask = "^3.0.0"
flask-restx = "^1.3.0"
flask-cors = "^4.0.0"
sysmlpy = {version = "^0.12.0", extras = ["graph"]}
networkx = "^3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
